# yaml-language-server: $schema=https://api.astropod.ai/schema/astroai.json
spec: astro/v1
name: sasbot

meta:
  description: An AI-powered agent

agent:
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NPM_SCOPE: "@saswatds"
      NPM_REGISTRY: "https://npm.pkg.github.com"
    secrets:
      - id: npm_token
        env: GITHUB_PACKAGES_TOKEN

models:
  ollama:
    provider: ollama
    model: qwen2.5:1.5b

knowledge:
  cache:
    provider: redis
  graph:
    provider: neo4j

ingestion:
  data:
    container:
      build:
        context: .
        dockerfile: Dockerfile.ingestion
        args:
          NPM_SCOPE: "@saswatds"
          NPM_REGISTRY: "https://npm.pkg.github.com"
        secrets:
          - id: npm_token
            env: GITHUB_PACKAGES_TOKEN
      port: 3001
    trigger:
      type: webhook

dev:
  interfaces: [web, slack]
