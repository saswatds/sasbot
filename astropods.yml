# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: sasbot

meta:
  visibility: private

agent:
  build:
    context: .
    dockerfile: Dockerfile

models:
  anthropic:
    provider: anthropic

knowledge:
  cache:
    provider: redis
  postgres:
    provider: postgres
  users:
    provider: postgres

providers:
  cloudflare:
    scope: [integrations]
    variables:
      - name: AI_API_KEY
        datatype: string
        description: Cloudflare Workers AI API key
        secret: true
      - name: ACCOUNT_ID
        datatype: string
        description: Cloudflare account ID
        secret: true

integrations:
  github:
    provider: github
  cloudflare:
    provider: cloudflare

dev:
  interfaces:
    messaging:
      adapters: [web]
