# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: sasbot

meta:
  visibility: private

agent:
  build:
    context: .
    dockerfile: Dockerfile

models:
  claude:
    provider: astro-gateway
    model: claude-sonnet 
  anthropic:
    provider: anthropic

knowledge:
  cache:
    provider: redis

providers:
  cloudflare:
    scope: [integrations]
    variables:
      - name: AI_API_KEY
        datatype: string
        description: Cloudflare Workers AI API key
        secret: true
      - name: ACCOUNT_ID
        datatype: string
        description: Cloudflare account ID
        secret: true

integrations:
  github:
    provider: github
  cloudflare:
    provider: cloudflare

