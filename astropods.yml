# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: sasbot

meta:
  visibility: private

agent:
  build:
    context: .
    dockerfile: Dockerfile
  inputs:
    - name: EMBEDDING_MODEL
      datatype: string
      description: Embedding model in provider/model format
      default: nomic-embed-text
      optional: true
    - name: EMBEDDING_DIMENSION
      datatype: number
      description: Vector dimension of the embedding model
      default: "768"
      optional: true

models:
  anthropic:
    provider: anthropic

knowledge:
  cache:
    provider: redis
  docs:
    provider: qdrant
    persistent: true
  graph:
    provider: neo4j

providers:
  cloudflare:
    scope: [integrations]
    variables:
      - name: AI_API_KEY
        datatype: string
        description: Cloudflare Workers AI API key
        secret: true
      - name: ACCOUNT_ID
        datatype: string
        description: Cloudflare account ID
        secret: true

integrations:
  github:
    provider: github
  cloudflare:
    provider: cloudflare

dev:
  interfaces:
    messaging:
      adapters: [web]
