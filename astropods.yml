# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: sasbot

meta:
  description: A personal assistant bot that helps with daily tasks and assistance

agent:
  build:
    context: .
    dockerfile: Dockerfile
  inputs:
    - name: EMBEDDING_MODEL
      datatype: string
      description: Embedding model in provider/model format
      default: nomic-embed-text
      optional: true
    - name: EMBEDDING_DIMENSION
      datatype: number
      description: Vector dimension of the embedding model
      default: "768"
      optional: true

models:
  ollama:
    provider: ollama
    model: qwen3.5:2b
  anthropic:
    provider: anthropic

knowledge:
  cache:
    provider: redis
  docs:
    provider: qdrant
    persistent: true
  graph:
    provider: neo4j

providers:
  cloudflare:
    scope: [integrations]
    variables:
      - name: AI_API_KEY
        datatype: string
        description: Cloudflare Workers AI API key
        secret: true
      - name: ACCOUNT_ID
        datatype: string
        description: Cloudflare account ID
        secret: true

integrations:
  github:
    provider: github
  cloudflare:
    provider: cloudflare

ingestion:
  webhook:
    container:
      build:
        context: .
        dockerfile: ingestion/webhook/Dockerfile
      port: 3001
    trigger:
      type: webhook

dev:
  interfaces: [web]
