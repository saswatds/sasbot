# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: blueprint/v1
name: sasbot

meta:
  visibility: private

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    messaging: true
    frontend: true

models:
  default:
    provider: gateway
    models: ['claude-opus-4-8', 'claude-sonnet-4-6']

knowledge:
  cache:
    provider: redis

  
integrations:
  github:
    provider: github

sandbox:
  toolchain: auto
  packages: [tmux, poppler-utils]
  python:
    version: "3.12"
    packages: [pandas, matplotlib]
  node:
    version: "22"
    packages: [tsx]
  env:
    SASBOT_MODE: preview
  setup:
    - "[ -d slugify ] || git clone --depth 1 https://github.com/sindresorhus/slugify slugify"

